<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Academy | Prototipo DevShare</title><style>
:root{--n:#102d4f;--t:#0b8e87;--g:#e1ad35;--bg:#f4f7fa;--tx:#182536;--m:#667586;--l:#dde5eb;--ok:#14704a}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}aside{background:var(--n);color:white;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;margin:4px 8px}.brand span{color:#67d2c9}.sub{font-size:11px;color:#bfd0df;margin:0 8px 20px}.nav button{width:100%;border:0;background:transparent;color:#dbe6ef;text-align:left;padding:11px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#1d466d;color:white}.notice{margin:18px 5px;padding:11px;border-radius:10px;background:#173b61;font-size:11px;color:#d4e2ee}main{padding:24px 28px 55px;min-width:0}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.muted{color:var(--m)}.roles{display:flex;gap:6px;flex-wrap:wrap}.roles button{border:1px solid var(--l);background:white;padding:8px 11px;border-radius:9px;cursor:pointer}.roles button.active{background:var(--n);color:white}.hero{background:linear-gradient(120deg,var(--n),#176d7b);color:white;border-radius:16px;padding:24px;margin-bottom:15px}.hero h2{margin:0 0 8px}.hero p{color:#dfedf3;max-width:850px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}.card{background:white;border:1px solid var(--l);border-radius:14px;padding:16px;box-shadow:0 4px 15px #15334f0a}.click{cursor:pointer;transition:.15s}.click:hover{transform:translateY(-2px);border-color:#9cb8c9}.kpi small{color:var(--m)}.kpi b{display:block;font-size:27px;color:var(--n);margin:7px 0}.btn{border:0;background:var(--t);color:white;font-weight:700;padding:9px 12px;border-radius:9px;cursor:pointer}.btn.alt{background:#edf3f6;color:var(--n)}.tag{display:inline-block;font-size:11px;background:#eef3f7;color:#526473;padding:5px 8px;border-radius:999px}.tag.ok{background:#e4f5ed;color:var(--ok)}.tag.gold{background:#fff4d9;color:#80600d}.progress{height:9px;background:#e7edf1;border-radius:20px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--t)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid var(--l);border-radius:10px;margin:8px 0}.section{display:none}.section.active{display:block}h2{font-size:20px}h3{font-size:15px;margin:0 0 7px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--l)}th{color:var(--m)}.course{border-left:5px solid var(--t)}.map{height:250px;border-radius:12px;background:linear-gradient(135deg,#e4f2ef,#dce8f1);position:relative}.pin{position:absolute;width:19px;height:19px;border:4px solid white;background:var(--t);border-radius:50%}.modal{display:none;position:fixed;inset:0;background:#07192ab8;z-index:20;padding:30px;overflow:auto}.modal.open{display:grid;place-items:center}.modalbox{background:white;width:min(760px,100%);border-radius:16px;padding:22px}.modalhead{display:flex;justify-content:space-between;gap:15px}.x{border:0;background:#edf3f6;border-radius:8px;padding:7px 10px;cursor:pointer}.field{display:grid;gap:5px;margin:10px 0}.field input,.field textarea,.field select{padding:10px;border:1px solid var(--l);border-radius:8px}.demo-label{font-size:11px;color:var(--m);margin-top:10px}.path{display:flex;gap:7px;overflow:auto}.step{min-width:135px;padding:12px;border:1px solid var(--l);border-radius:10px;background:white}.step b{color:var(--t);display:block}.toast{position:fixed;right:20px;bottom:20px;background:var(--n);color:white;padding:12px 15px;border-radius:10px;display:none;z-index:30}.toast.on{display:block}@media(max-width:950px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}.nav{display:flex;overflow:auto}.nav button{min-width:140px}.grid4,.grid2{grid-template-columns:1fr 1fr}}@media(max-width:620px){main{padding:17px}.top{align-items:flex-start;flex-direction:column}.grid4,.grid2{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><div class="brand">SMART <span>ACADEMY</span></div><div class="sub">ZENIT 2026 · Prototipo funzionale DevShare</div><div class="nav" id="nav"></div><div class="notice"><b>PROTOTIPO DIMOSTRATIVO</b><br>Dati, persone, date e contenuti sono fittizi. Flussi e funzioni sono una proposta da validare con capofila e partner.</div></aside><main><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted" id="who"></div></div><div class="roles"><button data-role="beneficiario">Beneficiario</button><button data-role="docente">Docente</button><button data-role="operatore">Operatore MAP</button><button data-role="admin">Amministratore</button></div></div><div id="content"></div></main></div><div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt">Dettaglio</h2><button class="x" id="close">Chiudi</button></div><div id="mb"></div></div></div><div class="toast" id="toast"></div><script>
const data={beneficiario:{name:'Giulia Rossi · Beneficiaria demo',nav:[['home','Dashboard'],['formazione','Formazione'],['community','Community'],['orientamento','Orientamento'],['vita','Il mio progetto di vita'],['handimap','HandiMap'],['opportunita','Cerco / Offro'],['repository','Repository']],},docente:{name:'Laura Bianchi · Docente demo',nav:[['home','Dashboard docente'],['corsi','I miei corsi'],['lezioni','Lezioni e materiali'],['classe','Partecipanti'],['community','Community'],['repository','Repository']]},operatore:{name:'Marco Verdi · Operatore MAP demo',nav:[['home','Dashboard operatore'],['beneficiari','Beneficiari'],['agenda','Agenda orientamento'],['percorsi','Percorsi personalizzati'],['community','Community'],['monitoraggio','Monitoraggio']]},admin:{name:'Amministratore · DevShare demo',nav:[['home','Dashboard amministrativa'],['utenti','Utenti e ruoli'],['gestione','Corsi e contenuti'],['monitoraggio','KPI e monitoraggio'],['repository','Repository'],['commissione','Presentazione Commissione']]}};
let role='beneficiario',page='home';const C=document.getElementById('content');
const k=(a,b,c='')=>`<div class="card kpi"><small>${a}</small><b>${b}</b><small>${c}</small></div>`;const prog=n=>`<div class="progress"><i style="width:${n}%"></i></div>`;const btn=(txt,act='info')=>`<button class="btn" data-act="${act}">${txt}</button>`;
function renderNav(){let n=document.getElementById('nav');n.innerHTML=data[role].nav.map(x=>`<button data-page="${x[0]}" class="${x[0]===page?'active':''}">${x[1]}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function beneficiary(){if(page==='home')return `<div class="hero"><h2>Il tuo percorso verso una maggiore autonomia</h2><p>Formazione, orientamento, community, attività pratica e progetto personalizzato di vita in un unico ambiente.</p>${btn('Continua la formazione','go-formazione')}</div><div class="grid4">${k('Formazione completata','42%','25 di 60 ore')}${k('Orientamento','3','colloqui svolti')}${k('HandiMap','7','schede demo')}${k('Progetto di vita','In costruzione','4 obiettivi attivi')}</div><br><div class="grid2"><div class="card"><h2>Prossime attività</h2><div class="row click" data-open="Lezione live|Accessibilità digitale · Modulo A · durata prevista 2 ore. Materiali e replica LIS saranno disponibili nell’area corso."><div><b>Lezione live</b><div class="muted">Accessibilità digitale · 18 settembre, 15:00</div></div><span class="tag gold">Formazione</span></div><div class="row click" data-open="Orientamento|Colloquio individuale con operatore MAP. Obiettivo: aggiornamento del percorso personalizzato e dei prossimi passi."><div><b>Colloquio orientamento</b><div class="muted">Operatore MAP · 20 settembre</div></div><span class="tag">Orientamento</span></div></div><div class="card"><h2>Il mio percorso</h2><div class="path"><div class="step"><b>01</b>Profilo</div><div class="step"><b>02</b>Formazione</div><div class="step"><b>03</b>Orientamento</div><div class="step"><b>04</b>Obiettivi</div><div class="step"><b>05</b>Azioni</div></div></div></div>`;
if(page==='formazione')return `<h2>Formazione · 60 ore sincrone</h2><div class="grid2"><div><div class="card course click" data-open="Modulo A|Competenze digitali e accessibilità. Avanzamento demo 70%. Qui il beneficiario trova calendario, lezioni, materiali, presenze e replica LIS."><h3>Modulo A · Competenze digitali e accessibilità</h3><p>20 ore · assegnazione partner indicativa da validare</p>${prog(70)}${btn('Entra nel corso')}</div><br><div class="card course click" data-open="Modulo B|Benessere e comunicazione. Avanzamento demo 25%."><h3>Modulo B · Benessere e comunicazione</h3><p>20 ore · assegnazione partner indicativa da validare</p>${prog(25)}</div><br><div class="card course click" data-open="Modulo C|Orientamento e autonomia. Modulo non ancora avviato nella simulazione."><h3>Modulo C · Orientamento e autonomia</h3><p>20 ore · assegnazione partner indicativa da validare</p>${prog(0)}</div></div><div class="card"><h3>Area lezione</h3><div style="height:180px;background:#102d4f;border-radius:10px;display:grid;place-items:center;color:white;font-size:44px">▶</div><p>Video/live, materiali, sottotitoli, replica LIS, test e avanzamento.</p><span class="tag">Demo funzionale</span></div></div>`;
if(page==='orientamento')return `<h2>Orientamento online</h2><div class="grid2"><div class="card"><h3>Prenota un colloquio</h3><div class="row"><span>22 settembre · 10:30</span>${btn('Prenota','book')}</div><div class="row"><span>23 settembre · 15:00</span>${btn('Prenota','book')}</div></div><div class="card"><h3>Autovalutazione</h3><p>Questionari e test online sui temi del percorso, con restituzione da parte degli operatori competenti.</p>${btn('Avvia test demo','test')}</div></div>`;
if(page==='vita')return `<h2>Progetto personalizzato di vita il più possibile indipendente</h2><div class="hero"><h2>Dal profilo alle azioni concrete</h2><p>Il percorso raccoglie bisogni, competenze, aspirazioni, obiettivi, azioni e verifiche. Il documento finale è un deliverable del percorso, costruito con i soggetti competenti.</p></div><div class="grid4">${k('Profilo','Completato')}${k('Obiettivi','4','demo')}${k('Azioni attive','6','demo')}${k('Revisione','20/09','data demo')}</div><br><div class="card"><table><tr><th>Obiettivo</th><th>Azione</th><th>Stato</th><th></th></tr><tr><td>Autonomia digitale</td><td>Completare Modulo A</td><td><span class="tag ok">In corso</span></td><td>${btn('Dettaglio')}</td></tr><tr><td>Partecipazione sociale</td><td>Community e attività pratica</td><td><span class="tag gold">Avviato</span></td><td>${btn('Dettaglio')}</td></tr></table></div>`;
if(page==='handimap')return `<h2>HandiMap · Applicazione pratica</h2><div class="grid2"><div class="card"><div class="map"><i class="pin" style="left:24%;top:37%"></i><i class="pin" style="left:53%;top:56%"></i><i class="pin" style="left:73%;top:28%"></i></div></div><div class="card"><h3>Rilevazione demo</h3><p><b>Biblioteca Civica Demo</b></p><div class="row">Ingresso accessibile <span class="tag ok">Sì</span></div><div class="row">Servizi igienici <span class="tag gold">Da verificare</span></div>${btn('Compila scheda','survey')}<p class="demo-label">Criteri, validazione e responsabilità saranno definiti con i soggetti competenti.</p></div></div>`;
if(page==='opportunita')return `<h2>Cerco / Offro · Opportunità</h2><div class="grid4"><div class="card click" data-open="Supporto digitalizzazione|Opportunità dimostrativa presso Associazione Demo APS. La piattaforma facilita l’incontro, senza garanzia di collocamento."><h3>Supporto digitalizzazione</h3><p>Associazione Demo APS</p><span class="tag">Collaborazione</span></div><div class="card click" data-open="Mappatura servizi|Esperienza pratica dimostrativa collegata alla mappatura."><h3>Mappatura servizi</h3><p>Impresa Sociale Demo</p><span class="tag">Esperienza</span></div></div><p class="muted">Funzione dimostrativa: non costituisce garanzia di assunzione, tirocinio o collocamento.</p>`;
return common();}
function docente(){if(page==='home')return `<div class="hero"><h2>Area docente</h2><p>Gestione didattica: corsi assegnati, calendario, materiali, lezioni, presenze e avanzamento dei partecipanti.</p></div><div class="grid4">${k('Corsi assegnati','2')}${k('Lezioni programmate','8')}${k('Materiali','14')}${k('Partecipanti','32','dati demo')}</div><br><div class="card"><h2>Prossime lezioni</h2><div class="row click" data-open="Gestisci lezione|Accessibilità digitale · 18 settembre, 15:00. Da qui il docente può associare materiale, link live, durata e registro demo."><b>Accessibilità digitale</b>${btn('Gestisci')}</div><div class="row click" data-open="Gestisci lezione|Comunicazione inclusiva · 21 settembre, 10:00."><b>Comunicazione inclusiva</b>${btn('Gestisci')}</div></div>`;
if(page==='corsi')return `<h2>I miei corsi</h2><div class="grid2"><div class="card course click" data-open="Corso assegnato|Modulo A · 20 ore. 12 partecipanti demo. 7 lezioni pianificate."><h3>Modulo A · Competenze digitali e accessibilità</h3>${prog(55)}${btn('Apri registro')}</div><div class="card course click" data-open="Corso assegnato|Modulo B · attività didattica assegnata al docente nella simulazione."><h3>Modulo B · Benessere e comunicazione</h3>${prog(20)}${btn('Apri corso')}</div></div>`;
if(page==='lezioni')return `<h2>Lezioni e materiali</h2><div class="card"><table><tr><th>Lezione</th><th>Data</th><th>Materiali</th><th>Azione</th></tr><tr><td>Accessibilità digitale</td><td>18/09</td><td>3</td><td>${btn('Modifica','edit')}</td></tr><tr><td>Servizi inclusivi</td><td>25/09</td><td>2</td><td>${btn('Modifica','edit')}</td></tr></table></div>`;
if(page==='classe')return `<h2>Partecipanti</h2><div class="card"><table><tr><th>Partecipante demo</th><th>Presenza</th><th>Avanzamento</th><th></th></tr><tr><td>Giulia Rossi</td><td>88%</td><td>${prog(70)}</td><td>${btn('Scheda')}</td></tr><tr><td>Anna Demo</td><td>92%</td><td>${prog(65)}</td><td>${btn('Scheda')}</td></tr></table><p class="demo-label">Nessun dato reale di beneficiari è utilizzato in questo prototipo.</p></div>`;return common();}
function operatore(){if(page==='home')return `<div class="hero"><h2>Area Operatore MAP</h2><p>Coordinamento operativo con i destinatari: profilazione, agenda, orientamento e accompagnamento verso gli obiettivi del progetto personalizzato.</p></div><div class="grid4">${k('Beneficiari assegnati','18')}${k('Colloqui settimana','9')}${k('Percorsi da rivedere','4')}${k('Test da restituire','6','dati demo')}</div><br><div class="card"><h2>Priorità</h2><div class="row click" data-open="Beneficiaria demo|Giulia Rossi · revisione progetto personalizzato prevista il 20/09."><b>Giulia Rossi</b><span class="tag gold">Revisione percorso</span></div><div class="row click" data-open="Beneficiaria demo|Anna Demo · test di autovalutazione completato, restituzione da programmare."><b>Anna Demo</b><span class="tag">Restituzione test</span></div></div>`;
if(page==='beneficiari')return `<h2>Beneficiari assegnati</h2><div class="card"><table><tr><th>Nome demo</th><th>Formazione</th><th>Orientamento</th><th>Percorso</th><th></th></tr><tr><td>Giulia Rossi</td><td>42%</td><td>3 colloqui</td><td><span class="tag ok">Attivo</span></td><td>${btn('Apri scheda')}</td></tr><tr><td>Anna Demo</td><td>35%</td><td>2 colloqui</td><td><span class="tag gold">Da aggiornare</span></td><td>${btn('Apri scheda')}</td></tr></table></div>`;
if(page==='agenda')return `<h2>Agenda orientamento</h2><div class="grid2"><div class="card"><h3>Oggi</h3><div class="row"><span>10:30 · Giulia Rossi</span>${btn('Apri','info')}</div><div class="row"><span>15:00 · Anna Demo</span>${btn('Apri','info')}</div></div><div class="card"><h3>Nuovo appuntamento</h3><div class="field"><label>Beneficiario demo</label><select><option>Giulia Rossi</option><option>Anna Demo</option></select></div><div class="field"><label>Nota</label><textarea placeholder="Nota dimostrativa"></textarea></div>${btn('Salva appuntamento','save')}</div></div>`;
if(page==='percorsi')return `<h2>Percorsi personalizzati</h2><div class="card"><table><tr><th>Beneficiario</th><th>Obiettivi</th><th>Azioni</th><th>Ultima revisione</th><th></th></tr><tr><td>Giulia Rossi</td><td>4</td><td>6</td><td>12/09</td><td>${btn('Gestisci')}</td></tr><tr><td>Anna Demo</td><td>3</td><td>5</td><td>10/09</td><td>${btn('Gestisci')}</td></tr></table></div>`;return common();}
function admin(){if(page==='home')return `<div class="hero"><h2>Amministrazione della piattaforma</h2><p>Configurazione utenti e ruoli, corsi, contenuti, tracciamento e indicatori. I dati visualizzati sono esclusivamente dimostrativi.</p></div><div class="grid4">${k('Utenti demo','128')}${k('Beneficiari','100','dato demo')}${k('Ore formative','60')}${k('Servizi diretti','160 h','60 formazione + 100 orientamento')}</div><br><div class="grid2"><div class="card"><h3>Avanzamento</h3><p>Formazione</p>${prog(62)}<p>Orientamento</p>${prog(48)}<p>Attività pratica</p>${prog(37)}</div><div class="card"><h3>Stato componenti</h3><div class="row">LMS <span class="tag ok">Demo attiva</span></div><div class="row">Community <span class="tag ok">Demo attiva</span></div><div class="row">Repository <span class="tag gold">Prototipo</span></div></div></div>`;
if(page==='utenti')return `<h2>Utenti e ruoli</h2><div class="card"><table><tr><th>Utente demo</th><th>Ruolo</th><th>Stato</th><th></th></tr><tr><td>Giulia Rossi</td><td>Beneficiario</td><td><span class="tag ok">Attivo</span></td><td>${btn('Gestisci')}</td></tr><tr><td>Laura Bianchi</td><td>Docente</td><td><span class="tag ok">Attivo</span></td><td>${btn('Gestisci')}</td></tr><tr><td>Marco Verdi</td><td>Operatore MAP</td><td><span class="tag ok">Attivo</span></td><td>${btn('Gestisci')}</td></tr></table></div>`;
if(page==='gestione')return `<h2>Corsi e contenuti</h2><div class="grid2"><div class="card"><h3>Struttura formativa</h3><div class="row">Modulo A · 20 h ${btn('Configura')}</div><div class="row">Modulo B · 20 h ${btn('Configura')}</div><div class="row">Modulo C · 20 h ${btn('Configura')}</div></div><div class="card"><h3>Funzioni editoriali</h3><p>Lezioni, materiali, replica LIS, test, news, repository e permessi di pubblicazione.</p>${btn('Nuovo contenuto','edit')}</div></div>`;
if(page==='commissione')return `<div class="hero"><h2>Presentazione alla Commissione</h2><p>La tecnologia non è il fine: integra formazione, orientamento, community, attività pratica e progetto personalizzato in un percorso unico, accessibile, tracciabile e potenzialmente replicabile.</p></div><div class="path"><div class="step"><b>1 · ENTRA</b>Profilo</div><div class="step"><b>2 · IMPARA</b>60 h</div><div class="step"><b>3 · PARTECIPA</b>Community</div><div class="step"><b>4 · SI ORIENTA</b>Online</div><div class="step"><b>5 · APPLICA</b>Esperienza</div><div class="step"><b>6 · PROGETTA</b>Vita indipendente</div></div><br><div class="grid2"><div class="card"><h2>Smart Academy come comunità</h2><p>Uno spazio che prosegue oltre il corso, favorendo socializzazione, mutuo aiuto, confronto e ricerca condivisa di soluzioni a problemi inattesi.</p></div><div class="card"><h2>Deliverable centrale</h2><p><b>Progetto personalizzato di vita il più possibile indipendente</b>, alimentato da formazione, orientamento, autovalutazione e accompagnamento.</p></div></div><br><div class="card"><h2>Perimetro del prototipo</h2><p>Non rappresenta un prodotto già realizzato né una specifica contrattuale definitiva. Rende tangibile la proposta funzionale che DevShare potrà progettare e sviluppare, da validare con MAP e gli altri partner.</p></div>`;return common();}
function common(){if(page==='community')return `<h2>Community · Socializzazione e mutuo aiuto</h2><div class="grid2"><div class="card"><h3>Forum</h3><div class="row click" data-open="Discussione demo|Esperienze di accessibilità urbana · 18 risposte demo."><b>Esperienze di accessibilità urbana</b><span class="tag">18 risposte</span></div><div class="row click" data-open="Discussione demo|Domande, confronto e supporto tra partecipanti e figure abilitate."><b>Domande e supporto</b><span class="tag">31 risposte</span></div></div><div class="card"><h3>Bacheca</h3><p>Materiali, appuntamenti, notizie e comunicazioni.</p>${btn('Nuovo messaggio','edit')}</div></div>`;if(page==='repository')return `<h2>Repository</h2><div class="card"><table><tr><th>Risorsa demo</th><th>Tipo</th><th>Visibilità</th><th></th></tr><tr><td>Toolkit accessibilità</td><td>PDF</td><td>Pubblico</td><td>${btn('Apri')}</td></tr><tr><td>Linee guida Smart Academy</td><td>Documento</td><td>Partner</td><td>${btn('Apri')}</td></tr></table></div>`;if(page==='monitoraggio')return `<h2>KPI e monitoraggio</h2><div class="grid4">${k('Partecipazione','84%','dato demo')}${k('Formazione','60 h')}${k('Orientamento','100 h','servizio previsto')}${k('Percorsi attivi','18','dato demo')}</div><br><div class="card"><p><b>Nota:</b> indicatori e metriche definitive saranno allineati al progetto approvato e alle regole di monitoraggio/rendicontazione.</p></div>`;return `<div class="card"><h2>Sezione in configurazione</h2><p>Questa vista appartiene al ruolo selezionato ed è rappresentata a livello dimostrativo.</p></div>`}
function render(){if(!data[role].nav.some(x=>x[0]===page))page='home';document.getElementById('who').textContent=data[role].name;document.querySelectorAll('.roles button').forEach(b=>b.classList.toggle('active',b.dataset.role===role));renderNav();document.getElementById('title').textContent=data[role].nav.find(x=>x[0]===page)?.[1]||'Smart Academy';C.innerHTML=role==='beneficiario'?beneficiary():role==='docente'?docente():role==='operatore'?operatore():admin();bind()}
function bind(){C.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{let [t,b]=e.dataset.open.split('|');openM(t,b)});C.querySelectorAll('[data-act]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();let a=e.dataset.act;if(a==='go-formazione'){page='formazione';render()}else if(['book','save','edit','test','survey'].includes(a))openM('Funzione dimostrativa',`Azione “${e.textContent}” simulata. In una release applicativa sarebbe collegata a permessi, validazioni, persistenza dati e notifiche.`);else openM('Dettaglio',`Scheda navigabile del ruolo ${role}. Questa interazione è dimostrativa e non utilizza dati reali.`)})}
function openM(t,b){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=`<p>${b}</p><p class="demo-label">Contenuto dimostrativo · nessun dato reale.</p>`;document.getElementById('modal').classList.add('open')}
document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};document.querySelectorAll('.roles button').forEach(b=>b.onclick=()=>{role=b.dataset.role;page='home';render()});render();
</script></body></html>
