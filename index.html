<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Academy | DevShare</title><style>:root{--n:#102d4f;--t:#078c84;--bg:#f4f7fa;--bd:#dce5eb;--tx:#172536;--mut:#687787;--gold:#e6b443}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}aside{background:var(--n);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:800;margin:4px 8px}.brand span{color:#66d2c8}.sub{font-size:11px;color:#bed0df;margin:0 8px 18px}.nav button{width:100%;border:0;background:transparent;color:#dce7ef;text-align:left;padding:10px;border-radius:9px;margin:2px 0;cursor:pointer}.nav button:hover,.nav button.on{background:#1c476e;color:#fff}.notice{margin:18px 5px;padding:11px;border-radius:10px;background:#173b61;font-size:11px;color:#d6e4ee}main{padding:24px 28px 60px;min-width:0}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.mut{color:var(--mut)}.roles{display:flex;gap:6px;flex-wrap:wrap}.roles button{border:1px solid var(--bd);background:#fff;padding:8px 10px;border-radius:9px;cursor:pointer}.roles button.on{background:var(--n);color:#fff}.hero{background:linear-gradient(120deg,var(--n),#176e79);color:#fff;border-radius:16px;padding:23px;margin-bottom:15px}.hero h2{margin:0 0 7px}.hero p{color:#dfedf3;max-width:850px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:13px}.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 4px 15px #15334f0a}.click{cursor:pointer;transition:.15s}.click:hover{transform:translateY(-2px);border-color:#9bb7c8}.kpi small{color:var(--mut)}.kpi b{display:block;font-size:26px;color:var(--n);margin:6px 0}.btn{border:0;background:var(--t);color:#fff;font-weight:700;padding:9px 12px;border-radius:9px;cursor:pointer}.btn.alt{background:#edf3f6;color:var(--n)}.tag{display:inline-block;font-size:11px;background:#eef3f7;color:#526473;padding:5px 8px;border-radius:999px}.ok{background:#e4f5ed;color:#14704a}.warn{background:#fff4d9;color:#80600d}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px;border:1px solid var(--bd);border-radius:10px;margin:8px 0}.progress{height:9px;background:#e7edf1;border-radius:20px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--t)}h2{font-size:20px}h3{font-size:15px;margin:0 0 7px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd)}th{color:var(--mut)}.field{display:grid;gap:5px;margin:10px 0}.field input,.field select,.field textarea{padding:10px;border:1px solid var(--bd);border-radius:8px}.modal{display:none;position:fixed;inset:0;background:#07192ab8;z-index:30;padding:25px;overflow:auto}.modal.open{display:grid;place-items:center}.box{background:#fff;width:min(760px,100%);border-radius:16px;padding:22px}.head{display:flex;justify-content:space-between;gap:15px}.x{border:0;background:#edf3f6;border-radius:8px;padding:7px 10px;cursor:pointer}.path{display:flex;gap:7px;overflow:auto}.step{min-width:130px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#fff}.step b{display:block;color:var(--t)}.demo{font-size:11px;color:var(--mut)}@media(max-width:950px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}.nav{display:flex;overflow:auto}.nav button{min-width:145px}.grid4,.grid2{grid-template-columns:1fr 1fr}}@media(max-width:620px){main{padding:16px}.top{flex-direction:column;align-items:flex-start}.grid4,.grid2{grid-template-columns:1fr}}</style></head><body><div class="app"><aside><div class="brand">SMART <span>ACADEMY</span></div><div class="sub">ZENIT 2026 · Prototipo funzionale DevShare</div><div class="nav" id="nav"></div><div class="notice"><b>PROTOTIPO DIMOSTRATIVO</b><br>Dati, persone, date, disponibilità e KPI sono fittizi. Funzioni e workflow sono una proposta da validare con MAP e partner.</div></aside><main><div class="top"><div><h1 id="title"></h1><div class="mut" id="who"></div></div><div class="roles"><button data-r="beneficiario">Beneficiario</button><button data-r="docente">Docente</button><button data-r="operatore">Operatore MAP</button><button data-r="admin">Amministratore</button></div></div><div id="content"></div></main></div><div class="modal" id="modal"><div class="box"><div class="head"><h2 id="mt"></h2><button class="x" onclick="closeM()">Chiudi</button></div><div id="mb"></div></div></div><script>const D={beneficiario:{who:'Giulia Rossi · Beneficiaria demo',nav:[['home','Dashboard'],['formazione','Formazione'],['aula','Aula virtuale'],['materiali','Materiali didattici'],['test','Test autovalutazione'],['sportello','Sportello Ascolto'],['orientamento','Orientamento'],['vita','Il mio progetto di vita'],['community','Community'],['handimap','HandiMap'],['opportunita','Cerco / Offro'],['helpdesk','Help Desk'],['repository','Repository']]},docente:{who:'Laura Bianchi · Docente demo',nav:[['home','Dashboard docente'],['corsi','I miei corsi'],['aula','Aula virtuale'],['materiali','Materiali didattici'],['classe','Partecipanti'],['test','Test didattici'],['community','Community'],['helpdesk','Help Desk'],['repository','Repository']]},operatore:{who:'Marco Verdi · Operatore MAP demo',nav:[['home','Dashboard operatore'],['beneficiari','Beneficiari'],['sportello','Sportello Ascolto'],['agenda','Agenda orientamento'],['percorsi','Percorsi personalizzati'],['test','Autovalutazioni'],['community','Community'],['helpdesk','Help Desk'],['monitoraggio','Monitoraggio']]},admin:{who:'Amministratore · DevShare demo',nav:[['home','Dashboard amministrativa'],['utenti','Utenti e ruoli'],['gestione','Corsi e contenuti'],['sportello','Sportello Ascolto'],['helpdesk','Help Desk'],['monitoraggio','KPI e monitoraggio'],['repository','Repository'],['commissione','Presentazione Commissione']]}};let role='beneficiario',page='home';const C=document.getElementById('content');const k=(a,b,c='')=>`<div class="card kpi"><small>${a}</small><b>${b}</b><small>${c}</small></div>`,pr=n=>`<div class="progress"><i style="width:${n}%"></i></div>`,bt=(t,a='detail')=>`<button class="btn" data-a="${a}">${t}</button>`;function nav(){let n=document.getElementById('nav');n.innerHTML=D[role].nav.map(x=>`<button class="${x[0]===page?'on':''}" data-p="${x[0]}">${x[1]}</button>`).join('');n.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()})}function dashboard(){if(role==='beneficiario')return `<div class="hero"><h2>Il tuo percorso verso una maggiore autonomia</h2><p>Formazione, aula virtuale, materiali, autovalutazione, Sportello Ascolto, orientamento, community e supporto in un unico ambiente.</p>${bt('Continua il percorso','formazione')}</div><div class="grid4">${k('Formazione','42%','25 di 60 ore')}${k('Prossimo colloquio','20/09','Sportello Ascolto')}${k('Test','2','da completare')}${k('Help Desk','1','ticket aperto')}</div><br><div class="grid2"><div class="card"><h2>Prossime attività</h2><div class="row click" data-open="Aula virtuale|Lezione live: Accessibilità digitale · 18 settembre, 15:00. Il pulsante di accesso diventa disponibile secondo configurazione."><div><b>Lezione live</b><div class="mut">Accessibilità digitale · 18/09 15:00</div></div><span class="tag warn">Formazione</span></div><div class="row click" data-open="Sportello Ascolto|Colloquio individuale prenotato con operatore MAP · 20 settembre, 10:30."><div><b>Colloquio prenotato</b><div class="mut">20/09 · 10:30</div></div><span class="tag">Sportello</span></div></div><div class="card"><h2>Il mio percorso</h2><div class="path"><div class="step"><b>01</b>Profilo</div><div class="step"><b>02</b>Formazione</div><div class="step"><b>03</b>Orientamento</div><div class="step"><b>04</b>Obiettivi</div><div class="step"><b>05</b>Azioni</div></div></div></div>`;if(role==='docente')return `<div class="hero"><h2>Area docente</h2><p>Gestione dei corsi assegnati, aula virtuale, materiali asincroni, partecipanti e strumenti didattici.</p></div><div class="grid4">${k('Corsi assegnati','2')}${k('Lezioni','8','programmate')}${k('Materiali','14')}${k('Partecipanti','32','dati demo')}</div><br><div class="card"><h2>Prossime lezioni</h2><div class="row click" data-open="Gestisci aula|Accessibilità digitale · 18/09 15:00. Configurazione link aula, materiali e stato lezione."><b>Accessibilità digitale</b>${bt('Gestisci')}</div></div>`;if(role==='operatore')return `<div class="hero"><h2>Area Operatore MAP</h2><p>Raccordo con i destinatari: Sportello Ascolto, orientamento, autovalutazioni e accompagnamento ai percorsi personalizzati.</p></div><div class="grid4">${k('Beneficiari assegnati','18')}${k('Sportello oggi','4','colloqui demo')}${k('Percorsi da rivedere','4')}${k('Test da restituire','6')}</div><br><div class="card"><h2>Priorità operative</h2><div class="row click" data-open="Beneficiaria demo|Giulia Rossi · revisione progetto personalizzato prevista il 20/09."><b>Giulia Rossi</b><span class="tag warn">Revisione percorso</span></div><div class="row click" data-open="Sportello Ascolto|Anna Demo · colloquio prenotato ore 15:00."><b>Anna Demo</b><span class="tag">Colloquio</span></div></div>`;return `<div class="hero"><h2>Amministrazione Smart Academy</h2><p>Utenti, ruoli, contenuti, Sportello Ascolto, Help Desk, monitoraggio e configurazioni del prototipo.</p></div><div class="grid4">${k('Utenti demo','128')}${k('Formazione','60 h','sincrona')}${k('Orientamento','100 h','complessive')}${k('Ticket aperti','7','dato demo')}</div>`}function common(){if(page==='aula')return `<h2>Aula virtuale</h2><div class="grid2"><div class="card"><h3>Accessibilità digitale</h3><p>18 settembre · 15:00–17:00 · Modulo A</p><div class="row">Stato <span class="tag warn">Programmata</span></div>${bt(role==='docente'?'Gestisci aula':'Entra in aula','room')}<p class="demo">L'integrazione con il provider di videoconferenza sarà definita in fase applicativa.</p></div><div class="card"><h3>Dopo la lezione</h3><p>Materiali, eventuale registrazione/replica autorizzata, replica LIS ove prevista e test collegati.</p>${bt('Vai ai materiali','materiali')}</div></div>`;if(page==='materiali')return `<h2>Materiali didattici · consultazione asincrona</h2><div class="card"><table><tr><th>Risorsa</th><th>Modulo</th><th>Tipo</th><th></th></tr><tr><td>Introduzione all'accessibilità</td><td>A</td><td>PDF</td><td>${bt('Consulta')}</td></tr><tr><td>Lezione accessibilità digitale</td><td>A</td><td>Video / replica</td><td>${bt('Apri')}</td></tr><tr><td>Materiale di approfondimento</td><td>B</td><td>Documento</td><td>${bt('Consulta')}</td></tr></table><p class="demo">Risorse dimostrative. Pubblicazione, diritti e accessibilità dei materiali saranno gestiti secondo ruoli e responsabilità.</p></div>`;if(page==='test')return `<h2>${role==='docente'?'Test didattici':'Test di autovalutazione'}</h2><div class="grid2"><div class="card"><h3>Autovalutazione · Competenze digitali</h3><p>10 domande · salvataggio progressivo</p><span class="tag warn">Da completare</span><br><br>${bt(role==='docente'?'Gestisci test':'Avvia test','test')}</div><div class="card"><h3>Storico</h3><div class="row">Consapevolezza e autonomia <span class="tag ok">Completato</span></div><p class="demo">Gli strumenti di autovalutazione non sono presentati come diagnosi cliniche o valutazioni professionali automatiche.</p></div></div>`;if(page==='community')return `<h2>Community · Socializzazione e mutuo aiuto</h2><div class="grid2"><div class="card"><h3>Forum</h3><div class="row click" data-open="Discussione demo|Esperienze di accessibilità urbana · confronto tra partecipanti e figure abilitate."><b>Esperienze di accessibilità urbana</b><span class="tag">18 risposte</span></div><div class="row click" data-open="Discussione demo|Spazio di confronto, mutuo aiuto e ricerca condivisa di soluzioni."><b>Domande e supporto</b><span class="tag">31 risposte</span></div></div><div class="card"><h3>Bacheca</h3><p>Notizie, appuntamenti, materiali e comunicazioni della Smart Academy.</p>${bt('Apri bacheca')}</div></div>`;if(page==='helpdesk')return `<h2>Help Desk</h2><div class="grid2"><div class="card"><h3>${role==='admin'?'Coda ticket':'Le mie richieste'}</h3><div class="row click" data-open="Ticket #HD-1042|Problema accesso aula virtuale · stato: In lavorazione · aggiornamento demo."><div><b>#HD-1042 · Accesso aula virtuale</b><div class="mut">Problema tecnico</div></div><span class="tag warn">In lavorazione</span></div><div class="row click" data-open="Ticket #HD-1031|Materiale non visualizzato · stato: Risolto."><div><b>#HD-1031 · Materiale non visualizzato</b></div><span class="tag ok">Risolto</span></div></div><div class="card"><h3>Apri richiesta</h3><div class="field"><label>Categoria</label><select><option>Accesso/account</option><option>Aula virtuale</option><option>Materiali</option><option>Formazione</option><option>Prenotazioni</option><option>Accessibilità</option><option>Altro</option></select></div><div class="field"><label>Descrizione</label><textarea placeholder="Descrivi il problema"></textarea></div>${bt('Invia ticket','save')}</div></div>`;if(page==='repository')return `<h2>Repository</h2><div class="card"><table><tr><th>Risorsa</th><th>Visibilità</th><th></th></tr><tr><td>Toolkit accessibilità</td><td>Beneficiari</td><td>${bt('Apri')}</td></tr><tr><td>Linee guida Smart Academy</td><td>Partner</td><td>${bt('Apri')}</td></tr></table></div>`;return null}function sportello(){if(role==='beneficiario')return `<h2>Sportello Ascolto</h2><div class="hero"><h2>Prenota il tuo colloquio</h2><p>Consulta le disponibilità e prenota uno slot. Date, operatori e disponibilità visualizzati sono esclusivamente dimostrativi.</p></div><div class="grid2"><div class="card"><h3>Disponibilità</h3><div class="row"><div><b>22 settembre · 10:30</b><div class="mut">Colloquio online · 45 min</div></div>${bt('Prenota','book')}</div><div class="row"><div><b>23 settembre · 15:00</b><div class="mut">Colloquio online · 45 min</div></div>${bt('Prenota','book')}</div><div class="row"><div><b>25 settembre · 11:30</b><div class="mut">Colloquio online · 45 min</div></div>${bt('Prenota','book')}</div></div><div class="card"><h3>Le mie prenotazioni</h3><div class="row"><div><b>20 settembre · 10:30</b><div class="mut">Operatore MAP demo</div></div><span class="tag ok">Confermato</span></div>${bt('Dettagli colloquio')}</div></div>`;if(role==='operatore')return `<h2>Sportello Ascolto · Agenda operatore</h2><div class="grid2"><div class="card"><h3>Colloqui di oggi</h3><div class="row"><span>10:30 · Giulia Rossi</span>${bt('Apri scheda')}</div><div class="row"><span>15:00 · Anna Demo</span>${bt('Apri scheda')}</div></div><div class="card"><h3>Gestisci disponibilità</h3><div class="field"><label>Data</label><input type="date"></div><div class="field"><label>Ora</label><input type="time"></div>${bt('Aggiungi disponibilità','save')}</div></div>`;return `<h2>Sportello Ascolto · Configurazione</h2><div class="grid4">${k('Slot settimana','28','demo')}${k('Prenotati','19')}${k('Completati','11')}${k('Annullati','2')}</div><br><div class="card"><h3>Configurazione servizio</h3><p>Operatori abilitati, disponibilità, durata colloqui, stati prenotazione e regole di modifica/annullamento.</p>${bt('Gestisci configurazione')}</div>`}function specific(){if(page==='sportello')return sportello();if(page==='formazione'||page==='corsi')return `<h2>${role==='docente'?'I miei corsi':'Formazione · 60 ore sincrone'}</h2><div class="grid2"><div class="card click" data-open="Modulo A|20 ore · calendario, aula, materiali, presenze e test. Assegnazioni definitive da validare."><h3>Modulo A · Competenze digitali e accessibilità</h3>${pr(70)}${bt(role==='docente'?'Gestisci corso':'Entra nel corso')}</div><div class="card click" data-open="Modulo B|20 ore · contenuti e assegnazioni configurabili."><h3>Modulo B · Benessere e comunicazione</h3>${pr(25)}</div></div>`;if(page==='orientamento'||page==='agenda')return `<h2>Orientamento online</h2><div class="grid2"><div class="card"><h3>Attività</h3><p>Tracciamento di appuntamenti, durata, stato, follow-up e avanzamento. Le 100 ore indicate sono complessive di servizio progettuale, non per singolo beneficiario.</p>${bt(role==='operatore'?'Gestisci agenda':'Vai allo Sportello','sportello')}</div><div class="card"><h3>Autovalutazione</h3><p>Questionari sui temi del percorso e restituzione da parte delle figure competenti.</p>${bt('Apri test','test')}</div></div>`;if(page==='vita'||page==='percorsi')return `<h2>Progetto personalizzato di vita il più possibile indipendente</h2><div class="hero"><h2>Dal profilo alle azioni concrete</h2><p>Bisogni e aspirazioni → competenze → formazione → autovalutazione → orientamento → obiettivi → azioni → verifica.</p></div><div class="grid4">${k('Profilo','Completato')}${k('Obiettivi','4','demo')}${k('Azioni','6','demo')}${k('Revisione','20/09','data demo')}</div><br><div class="card"><table><tr><th>Obiettivo</th><th>Azione</th><th>Stato</th><th></th></tr><tr><td>Autonomia digitale</td><td>Completare Modulo A</td><td><span class="tag ok">In corso</span></td><td>${bt('Dettaglio')}</td></tr><tr><td>Partecipazione sociale</td><td>Community e attività pratica</td><td><span class="tag warn">Avviato</span></td><td>${bt('Dettaglio')}</td></tr></table></div>`;if(page==='beneficiari'||page==='classe'||page==='utenti')return `<h2>${page==='utenti'?'Utenti e ruoli':page==='classe'?'Partecipanti':'Beneficiari assegnati'}</h2><div class="card"><table><tr><th>Nome demo</th><th>Ruolo / percorso</th><th>Stato</th><th></th></tr><tr><td>Giulia Rossi</td><td>Beneficiaria</td><td><span class="tag ok">Attivo</span></td><td>${bt('Apri scheda')}</td></tr><tr><td>Anna Demo</td><td>Beneficiaria</td><td><span class="tag warn">Da aggiornare</span></td><td>${bt('Apri scheda')}</td></tr></table><p class="demo">Nessun dato personale reale è utilizzato nel prototipo.</p></div>`;if(page==='handimap')return `<h2>HandiMap · Applicazione pratica</h2><div class="card"><h3>Rilevazioni demo</h3><p>Attività pratica collegabile all'ecosistema HandiMap, con workflow di bozza, invio e validazione da definire.</p>${bt('Compila scheda demo')}</div>`;if(page==='opportunita')return `<h2>Cerco / Offro</h2><div class="grid2"><div class="card click" data-open="Opportunità demo|Supporto digitalizzazione presso Associazione Demo APS."><h3>Supporto digitalizzazione</h3><span class="tag">Collaborazione</span></div><div class="card click" data-open="Opportunità demo|Esperienza pratica di mappatura servizi."><h3>Mappatura servizi</h3><span class="tag">Esperienza</span></div></div><p class="mut">La funzione facilita l'incontro con opportunità e non garantisce assunzione, tirocinio o collocamento.</p>`;if(page==='gestione')return `<h2>Corsi e contenuti</h2><div class="card"><div class="row">Corsi e moduli ${bt('Configura')}</div><div class="row">Aule virtuali ${bt('Configura')}</div><div class="row">Materiali asincroni ${bt('Configura')}</div><div class="row">Test ${bt('Configura')}</div></div>`;if(page==='monitoraggio')return `<h2>KPI e monitoraggio</h2><div class="grid4">${k('Partecipazione','84%','dato demo')}${k('Formazione','60 h')}${k('Orientamento','100 h','complessive')}${k('Percorsi attivi','18','dato demo')}</div>`;if(page==='commissione')return `<div class="hero"><h2>Presentazione alla Commissione</h2><p>La tecnologia integra formazione, aula virtuale, materiali asincroni, autovalutazione, Sportello Ascolto, orientamento, community, supporto e progetto personalizzato.</p></div><div class="path"><div class="step"><b>1 · ENTRA</b>Profilo</div><div class="step"><b>2 · IMPARA</b>60 h</div><div class="step"><b>3 · PARTECIPA</b>Community</div><div class="step"><b>4 · ASCOLTO</b>Sportello</div><div class="step"><b>5 · SI ORIENTA</b>Online</div><div class="step"><b>6 · PROGETTA</b>Vita indipendente</div></div><br><div class="grid2"><div class="card"><h2>Continuità</h2><p>L'aula sincrona è affiancata da materiali consultabili in asincrono, test, community e Help Desk.</p></div><div class="card"><h2>Deliverable</h2><p><b>Progetto personalizzato di vita il più possibile indipendente.</b></p></div></div>`;return null}function render(){if(!D[role].nav.some(x=>x[0]===page))page='home';document.getElementById('who').textContent=D[role].who;document.querySelectorAll('.roles button').forEach(b=>b.classList.toggle('on',b.dataset.r===role));nav();document.getElementById('title').textContent=D[role].nav.find(x=>x[0]===page)?.[1]||'Smart Academy';C.innerHTML=page==='home'?dashboard():(common()||specific()||'<div class="card"><h2>Sezione demo</h2><p>Vista in configurazione.</p></div>');bind()}function bind(){C.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{let z=e.dataset.open.split('|');openM(z[0],z[1])});C.querySelectorAll('[data-a]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();let a=e.dataset.a;if(D[role].nav.some(x=>x[0]===a)){page=a;render();return}if(a==='book')openM('Prenotazione colloquio','Slot selezionato. Nella versione applicativa il sistema controllerà disponibilità e doppie prenotazioni prima della conferma.');else if(a==='save')openM('Operazione demo','Dati acquisiti nella simulazione. La versione applicativa userà persistenza, permessi, validazioni e audit log.');else if(a==='room')openM('Aula virtuale','Accesso aula simulato. Il provider e le regole di accesso saranno configurati in fase applicativa.');else openM('Scheda navigabile',`Azione “${e.textContent}” simulata per il ruolo ${role}.`)})}function openM(t,b){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=`<p>${b}</p><p class="demo">Contenuto dimostrativo · nessun dato reale.</p>`;document.getElementById('modal').classList.add('open')}function closeM(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeM()};document.querySelectorAll('.roles button').forEach(b=>b.onclick=()=>{role=b.dataset.r;page='home';render()});render();</script></body></html>
